name: Product feedback
description: Describe a business task or a capability you would find useful.
title: "[Feedback] "
body:
  - type: markdown
    attributes:
      value: Use synthetic examples only. Do not include customer data, credentials, or private code.
  - type: textarea
    id: task
    attributes:
      label: Business task
      description: What are you trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: Successful outcome
      description: What would a useful result look like, and what constraints matter?
    validations:
      required: true
